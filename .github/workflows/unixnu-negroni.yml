name: unixnu-negroni

# UniXNU 4 KiB XNU (xnu-10063.141.1 + UniXNU patches), prelinked against the unchanged iPad7,1 iPadOS 17.7.11
# kernelcache, and the DarwinBoot payload volume for negroni (device repository: unixnu-negroni/).
# The firmware and boot image come from uefi/negroni (shim + Mu-Silicium) and are not built here.
#
# Apple binaries (kernelcache-derived kernel, payload) leave the runner only encrypted with the
# ARTIFACT_KEY secret: this repository is public. Decrypt with
#   openssl enc -d -aes-256-cbc -pbkdf2 -in negroni-unixnu.tar.enc -pass file:KEYFILE | tar -x

on:
  workflow_dispatch:
    inputs:
      steps:
        description: unixnu build steps
        default: kernel payload
  push:
    branches: [main]
    paths:
      - "unixnu-negroni/**"
      - ".github/workflows/unixnu-negroni.yml"

concurrency:
  group: unixnu-negroni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIQUE_CHIP_ID }}
      JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          brew install llvm mtools dtc cmake ninja unifdef
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Authenticated GitHub API for UniXNU's Python fetches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # prepare-xnu-source.py reads apple-oss-distributions/xnu through api.github.com anonymously,
          # which the shared runner IPs exhaust (HTTP 403 rate limit). Add the job token to those requests.
          mkdir -p "$RUNNER_TEMP/pyauth"
          cat > "$RUNNER_TEMP/pyauth/sitecustomize.py" <<'PY'
          import os, urllib.request
          _token = os.environ.get('GH_API_TOKEN')
          class _GitHubAuth(urllib.request.BaseHandler):
              def http_request(self, req):
                  if _token and req.host == 'api.github.com':
                      req.add_header('Authorization', 'Bearer ' + _token)
                  return req
              https_request = http_request
          urllib.request.install_opener(urllib.request.build_opener(_GitHubAuth()))
          PY
          echo "PYTHONPATH=$RUNNER_TEMP/pyauth" >> "$GITHUB_ENV"
          echo "GH_API_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"

      - name: UniXNU
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/UniXNU/UniXNU.git "$RUNNER_TEMP/UniXNU"
          git -C "$RUNNER_TEMP/UniXNU" log -1 --format='UniXNU %H %cd'
          # NativeUfs is written for sheng (SM8550): SM8450 compatible, GCC branches and UFS stream ID
          python3 "$GITHUB_WORKSPACE/unixnu-negroni/scripts/patch-native-ufs.py" "$RUNNER_TEMP/UniXNU/drivers/NativeUfs"
          # Fresh-tree bootstrap pass: build-xnu-4k-baseline.sh tests for archives (corecrypto, drivers) that only
          # the later archive step builds, so the pass exits before compiling and leaves no compile records.
          # For that pass only, turn every enabled XNU_* feature off: plain XNU compiles and leaves the records.
          python3 - "$RUNNER_TEMP/UniXNU/scripts/unixnu/kernel.py" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "subprocess_env = {**env, 'XNU_BOOT_PROGRESS': '0'}"
          new = ("subprocess_env = {**{k: ('0' if k.startswith('XNU_') and v == '1' else v) for k, v in env.items()}, "
                 "'XNU_BOOT_PROGRESS': '0', 'XNU_CRYPTO_BOOTSTRAP': 'source'}")
          assert old in s, 'unixnu kernel.py changed: bootstrap env line not found'
          open(p, 'w').write(s.replace(old, new))
          PY

      - name: Configure and fetch
        working-directory: ${{ runner.temp }}/UniXNU
        run: |
          # sheng's TouchProbe (compiled into the legacy display archive, inactive without sheng-touch args) includes
          # NativeNovatekTouch headers; the driver is not part of this repository's copy of the sheng device repo
          git clone -q --depth 1 https://github.com/UniXNU/NativeNovatekTouch.git "$GITHUB_WORKSPACE/unixnu-negroni/drivers/NativeNovatekTouch"
          ./unixnu defconfig negroni_defconfig -D "$GITHUB_WORKSPACE/unixnu-negroni"
          ./unixnu fetch
          ./unixnu status
          ./unixnu ipsw fetch

      # Ladder: UniXNU's VirtIO/RAM block bindings (and with them the owner-root chain and boot progress) read
      # build/storage-abi/interface-audit.json, which audit-storage-interface.py makes from a prelinked candidate
      # build/native-prelink/native-apfs-load-positive.macho that no published script produces. Stage 1 builds and
      # prelinks a kernel without those parts; that candidate feeds the audit; stage 2 is the real negroni build.
      - name: Stage 1 kernel (audit candidate)
        working-directory: ${{ runner.temp }}/UniXNU
        run: |
          S1="$RUNNER_TEMP/unixnu-negroni-stage1"
          rm -rf "$S1"; cp -R "$GITHUB_WORKSPACE/unixnu-negroni" "$S1"
          python3 - "$S1/board.toml" <<'PY'
          import re, sys
          p = sys.argv[1]; s = open(p).read()
          # stage 1: the empty legacy display probe instead of the real driver
          s = s.replace('  "build-native-legacy-display.py",\n', '  "build-legacy-display-stub.py",\n')
          # stage 1 is only the audit candidate: no block drivers (NativeUfs/NativeRamBlock need the audit's bindings)
          for line in ('  "build-sheng-platform-power.py",\n', '  "build-arm-driver.py NativeUfs",\n', '  "build-arm-driver.py NativeRamBlock",\n',
                       '  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",\n'):
              s = s.replace(line, '')
          open(p, 'w').write(s)
          PY
          ./unixnu defconfig negroni_stage1_defconfig -D "$S1"
          ./unixnu build kernel

      - name: Audit inputs for stage 2 (legacy display)
        working-directory: ${{ runner.temp }}/UniXNU
        run: |
          T=out/negroni/tree
          mkdir -p "$T/build/native-prelink"
          cp out/negroni/kernel/kernel.macho "$T/build/native-prelink/native-apfs-load-positive.macho"
          cp out/negroni/kernel/kernel.json "$T/build/native-prelink/native-apfs-load-positive.json"
          # Xcode 16.4 clang: tolerate the newer-clang warning flag in UniXNU's audit scripts too
          for f in "$T"/scripts/audit-*.py; do
            sed -i '' "s/'-Wno-unnecessary-virtual-specifier'/'-Wno-unknown-warning-option', '-Wno-unnecessary-virtual-specifier'/g" "$f"
          done
          (cd "$T" && python3 scripts/audit-storage-interface.py)
          ls -la "$T/build/storage-abi/interface-audit.json"
          # Legacy display audit: same candidate (it carries the unchanged original IOMobileGraphicsFamily, checked by
          # hash in the audit) and the recorded hash of the pruned QEMU class observation, as its fallback expects.
          cp out/negroni/kernel/kernel.macho "$T/build/native-prelink/native-owner-mobile-graphics-candidate.macho"
          cp out/negroni/kernel/kernel.json "$T/build/native-prelink/native-owner-mobile-graphics-candidate.json"
          # NativeHidInput (built by the legacy display archive) audits against a candidate of this name family; same
          # original kernelcache and slide, so the original IOHIDFamily it checks is identical
          cp out/negroni/kernel/kernel.macho "$T/build/native-prelink/native-owner-ufs-cpu-desktop-stage1-candidate.macho"
          cp out/negroni/kernel/kernel.json "$T/build/native-prelink/native-owner-ufs-cpu-desktop-stage1-candidate.json"
          # audit-amfi-pmgr-contract.py reads the original kernelcache from the firmware cache; the prelink step already
          # decompressed and pinned it under out/ipsw
          KC=$(find out/ipsw -name kernelcache.decompressed | head -1); test -n "$KC"
          # the tree's .cache/firmware is a link to the device repository's, re-made when stage 2 assembles the tree
          FW="$GITHUB_WORKSPACE/unixnu-negroni/.cache/firmware/kernelcache.macho"
          mkdir -p "$FW"
          cp "$KC" "$FW/kernelcache.release.ipad7.decompressed"
          mkdir -p "$T/build/display-analysis"
          [ -f "$T/build/display-analysis/mobile-graphics-legacy-abi.json" ] ||
            echo '{"runtime_metadata_checkpoint_sha256": "3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b"}' \
              > "$T/build/display-analysis/mobile-graphics-legacy-abi.json"

      - name: Stage 2 build
        working-directory: ${{ runner.temp }}/UniXNU
        run: |
          ./unixnu defconfig negroni_defconfig -D "$GITHUB_WORKSPACE/unixnu-negroni"
          ./unixnu build ${{ inputs.steps || 'kernel payload' }}

      - name: Encrypt outputs
        if: success()
        working-directory: ${{ runner.temp }}/UniXNU
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY"
          ls -la out/negroni/kernel out/negroni/payload || true
          tar -cf - -C out/negroni kernel/kernel.macho payload |
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -out "$RUNNER_TEMP/negroni-unixnu.tar.enc"
          shasum -a 256 "$RUNNER_TEMP/negroni-unixnu.tar.enc"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: negroni-unixnu-encrypted
          path: ${{ runner.temp }}/negroni-unixnu.tar.enc
          retention-days: 7

      - name: Collect logs
        if: always()
        working-directory: ${{ runner.temp }}/UniXNU
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp -R out/negroni/logs "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cp out/state.json "$RUNNER_TEMP/logs/" 2>/dev/null || true
          # archive builders keep only a tail in their log; the full compiler output stays in the tree
          (cd out/negroni/tree/build 2>/dev/null && find -L . -maxdepth 3 -name compile.log | while read -r f; do
            cp "$f" "$RUNNER_TEMP/logs/compile-$(echo "${f#./}" | tr / _)"; done) || true
          find out/negroni -maxdepth 2 -name '*.json' -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: negroni-unixnu-logs
          path: ${{ runner.temp }}/logs
          retention-days: 7
