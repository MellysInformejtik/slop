name: gpu-metal

# Metal for the negroni iOS 18 userland: UniXNU's NativeMetal plugin (Metal device over AIR -> SPIR-V
# with metal2vulkan) and Turnip with its Darwin KMD (the NativeAdreno user-client ABI, served on negroni
# by AGXDeviceUserClient, negroni-ios/xnu/patches-ios18/0129). Built with UniXNU's own scripts at their
# pinned sources: Mesa 85fda3b3 + patches/mesa, steelbrain/metal2vulkan 720ef1ce + bridge patches.
# Output: NativeAdrenoMetal.bundle, libvulkan_freedreno.dylib, libnative_metal_bridge.a, logs.
# All inputs are MIT/BSD sources; nothing from Apple is in the artifact.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: how far to build (turnip, bridge, plugin)
        default: plugin

env:
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU.git
  UNIXNU_COMMIT: fb2bb310564ce66779e472a021881cf7c5764919

jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install meson ninja llvm bison flex glslang shaderc vulkan-headers
          # build-native-metal-bridge.py runs `cargo +1.98.0`
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version

      - name: "UniXNU (pinned): NativeMetal, NativeAdreno, AdrenoPM4, ArmSmmu4K, AdrenoFirmware"
        run: |
          U="$RUNNER_TEMP/UniXNU"
          git clone -q "$UNIXNU_REPO" "$U"
          git -C "$U" checkout -q "$UNIXNU_COMMIT"
          M="drivers/NativeMetal drivers/NativeAdreno drivers/NativeMobileDisplay kits/AdrenoPM4 kits/ArmSmmu4K kits/AdrenoFirmware"
          git -C "$U" submodule update --init --depth 50 $M
          git -C "$U" submodule status $M
          echo "U=$U" >> "$GITHUB_ENV"

      - name: Pinned inputs (.cache)
        run: |
          cd "$U"
          mkdir -p .cache/gpu-reference .cache/mesa-tools/bin
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip -q install meson mako pyyaml packaging
          for t in bison flex; do ln -sf "$(brew --prefix $t)/bin/$t" .cache/mesa-tools/bin/$t; done
          M=$(python3 -c "import json;print(json.load(open('scripts/data/adreno-compiler-inputs.json'))['mesa']['commit'])")
          git init -q .cache/mesa-work
          git -C .cache/mesa-work fetch -q --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git "$M"
          git -C .cache/mesa-work checkout -q FETCH_HEAD
          for p in $(python3 -c "import json;print(' '.join(json.load(open('scripts/data/adreno-compiler-inputs.json'))['patches']))"); do
            echo "mesa patch $p"; git -C .cache/mesa-work apply "$U/$p"
          done
          T=$(python3 -c "import json;print(json.load(open('scripts/data/gpu-metal-vulkan-inputs.json'))['translator']['commit'])")
          git init -q .cache/gpu-reference/metal2vulkan
          git -C .cache/gpu-reference/metal2vulkan fetch -q --depth 1 https://github.com/steelbrain/metal2vulkan.git "$T"
          git -C .cache/gpu-reference/metal2vulkan checkout -q FETCH_HEAD

      - name: Turnip (Darwin KMD, iOS)
        run: |
          cd "$U"
          python3 scripts/build-turnip-darwin.py --target ios || { tail -60 .cache/mesa-tu-ios-*.log; exit 1; }

      - name: metal2vulkan bridge (iOS)
        if: inputs.stage != 'turnip'
        run: |
          cd "$U"
          python3 scripts/build-native-metal-bridge.py --target ios

      - name: Turnip (host, for the plugin's recorded smoke submission)
        if: inputs.stage == 'plugin'
        run: |
          cd "$U"
          python3 scripts/build-turnip-darwin.py --target host || { tail -60 .cache/mesa-tu-host-*.log; exit 1; }

      - name: Skip the host-only controls
        if: inputs.stage == 'plugin'
        run: |
          # check-turnip-darwin-host.py (run by gen-turnip-replay.py for the plugin's recorded smoke submission) ends with two
          # host-only cache controls that run no shader: check-quartzcore-turnip-cache-host.py is not in UniXNU at this revision,
          # check-priming-cache-host.py does not compile on the runner; the final watchdog control cannot sample on the runner.
          # None feeds the build (the replay needs only libhostiokit.dylib and plugin_smoke); they are dropped.
          cd "$U"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-turnip-darwin-host.py'); s = p.read_text()
          a = s.index("with tempfile.TemporaryDirectory(prefix='quartzcore-driver-cache-'")
          b = s.index("env_plugin = dict(env)")
          s = s[:a] + s[b:]
          # the stalled-worker watchdog control needs the runner to sample a thread, which it does not allow
          w = s.index('# Watchdog:')
          p.write_text(s[:w]); print('dropped', s.count('subprocess.run') - p.read_text().count('subprocess.run'), 'host-only controls')
          PY

      - name: iOS 18 (22H352) adjustments to NativeMetal
        if: inputs.stage == 'plugin'
        run: |
          # The frontend refuses a _MTLDevice whose instance size is not iPadOS 17.7.11's 536 bytes; iOS 18's base class has more
          # ivars. The dynamic subclass adds none of its own, so any base size works: keep the check for the class, log the size.
          cd "$U"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/NativeMetal/NativeBridgeMetalFrontend.mm'); s = p.read_text()
          old = 'if(!base || class_getInstanceSize(base)!=536){NBLOG(@"native-metal: unexpected _MTLDevice ABI");return nil;}'
          assert s.count(old) == 1, 'anchor'
          s = s.replace(old, 'if(!base){NBLOG(@"native-metal: no _MTLDevice");return nil;}\n NBLOG(@"native-metal: _MTLDevice instance size %zu (iPadOS 17.7.11: 536)",class_getInstanceSize(base));')
          p.write_text(s); print('iOS 18: _MTLDevice size check relaxed')
          PY
          # iOS 18 sends the plugin's objects methods the iPadOS 17 frontend lacks; it threw (backboardd crash-looped, sig 6 from
          # objc_exception_throw <- doesNotRecognizeSelector). They are now answered with nil/0 and named in the kernel log (MISS ...).
          python3 "$GITHUB_WORKSPACE/negroni-ios/gpu/ios18/answer-missing-selectors.py"

      - name: NativeMetal plugin
        if: inputs.stage == 'plugin'
        run: |
          cd "$U"
          python3 scripts/build-adreno-metal-plugin.py

      - name: Collect
        if: always()
        run: |
          mkdir -p out/logs
          cp "$U"/.cache/*.log out/logs/ 2>/dev/null || true
          cp "$U/build/mesa-tu-ios/src/freedreno/vulkan/libvulkan_freedreno.dylib" out/ 2>/dev/null || true
          cp "$U/build/mesa-tu-ios/builtin-build-profile.json" out/ 2>/dev/null || true
          cp "$U"/build/native-metal-bridge/ios/*.a out/ 2>/dev/null || true
          cp -R "$U/build/adreno-metal-plugin" out/ 2>/dev/null || true
          ls -laR out | head -60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: negroni-gpu-metal
          path: out
